<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Codificación de caracteres: permite tildes y ñ -->
  <meta charset="UTF-8">
  <!-- Hace que la página use el ancho real del celular y evita el zoom con dos dedos -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Smille God — Prototipo</title>
  <!-- Tipografía de fantasía "Cinzel" (Google Fonts, licencia libre OFL) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Quitamos márgenes y barras de desplazamiento: el juego ocupa toda la pantalla */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0f1a;
      overflow: hidden;
      touch-action: none; /* evita que el navegador desplace la página al tocar el juego */
    }

    /* Aviso "Gira tu celular": oculto por defecto... */
    #aviso-girar {
      display: none;
      position: fixed;
      inset: 0;               /* ocupa toda la pantalla */
      z-index: 10;            /* queda por encima del juego */
      background: #0b0f1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
    }
    /* ...y visible solo cuando la pantalla está en vertical */
    @media (orientation: portrait) {
      #aviso-girar { display: flex; }
    }
    #aviso-girar .icono { font-size: 72px; }
    #aviso-girar h2 { margin: 0; color: #f5c542; font-family: Georgia, serif; }
    #aviso-girar button {
      font-size: 20px;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      background: #f5c542;
      color: #0b0f1a;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Aviso para jugar en horizontal (solo se ve en vertical, gracias al CSS de arriba) -->
  <div id="aviso-girar">
    <div class="icono">📱↻</div>
    <h2>Gira tu celular</h2>
    <p>Smille God se juega en horizontal.</p>
    <button id="boton-jugar">Jugar en pantalla completa</button>
  </div>

  <!-- 1) Cargamos la librería Phaser desde internet (versión fija, para que no cambie sola) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <!-- Etapa 9: PeerJS (WebRTC) para jugar en pareja. Versión fija. -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <!-- 2) Cargamos NUESTRO código. Va después de Phaser porque lo usa.
       type="module" permite dividir el código en varios archivos con import/export. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
